# Checks that every example still compiles against the published SDKs.
# Nothing here calls the API: no key is needed, and no order is ever placed.
name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch a new SDK release that breaks an example

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt mypy
      - run: python -m py_compile python/*.py
      - run: mypy --strict python/*.py

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck curl/*.sh
